apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheikh-webapp-test
  namespace: sheikh-devops-test
  labels:
    app: sheikh-webapp-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sheikh-webapp-test
  template:
    metadata:
      labels:
        app: sheikh-webapp-test
    spec:
      containers:
        - name: webapp-test
          image: ghcr.io/sheikh162/webapp-test:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_ENV
              value: "Prod"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "100m" # millicores, therefore, 100m = 0.1 CPU
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
